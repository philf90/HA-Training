delete_workout:
  fields:
    workout_id:
      required: true
      example: "D6B529A9-0A4E-4E5A-818C-95C356458639"
      selector:
        text:
undelete_workout:
  fields:
    workout_id:
      required: true
      example: "D6B529A9-0A4E-4E5A-818C-95C356458639"
      selector:
        text:
get_workouts:
  fields:
    start:
      example: "2026-11-01 00:00:00"
      selector:
        datetime:
    end:
      example: "2026-11-08 00:00:00"
      selector:
        datetime:
    sport:
      selector:
        select:
          translation_key: sport
          options:
            - foot
            - cycling
            - swimming
            - other
    limit:
      default: 30
      selector:
        number:
          min: 1
          max: 500
          mode: box
