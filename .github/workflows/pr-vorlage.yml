# Verbindliche PR-Vorlage: prueft Beschreibung und Version bei jedem neuen
# Stand und jeder Aenderung der Beschreibung. Verbindlich wird sie erst als
# Pflicht-Pruefung im Branch-Schutz von main (Einstellung bei GitHub).
name: PR-Vorlage

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  vorlage:
    name: PR-Vorlage
    # Dependabot-PRs (nur Versionen der Actions) haben keine ausgefuellte
    # Vorlage. Ein uebersprungener Job meldet "Success" und blockiert auch als
    # Pflichtpruefung nicht (GitHub-Doku "Using conditions to control job
    # execution").
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Beschreibung und Version pruefen
        env:
          # Als Umgebungsvariable, nie direkt im Skript: Die Beschreibung ist
          # fremder Text und koennte sonst Shell-Code einschleusen.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/pruefe_pr.py
