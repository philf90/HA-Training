# Prueft jeden Push auf main und jeden Pull Request: Code-Stil, Tests,
# hassfest (Pruefung von Home Assistant) und die HACS-Pruefung.
# Tests laufen gegen dieselbe Home-Assistant-Version wie lokal
# (pytest-homeassistant-custom-component 0.13.316 = Home Assistant 2026.2.3).
name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ruff und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten installieren
        run: pip install pytest-homeassistant-custom-component==0.13.316 ruff==0.16.9

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest tests -q

  # hassfest und HACS sind auf einen Commit festgelegt, laden aber ein
  # Container-Image mit beweglichem Tag (ghcr.io/home-assistant/hassfest,
  # ghcr.io/hacs/action:main). Das ist gewollt: Sie sollen gegen die aktuellen
  # Regeln von Home Assistant und HACS pruefen.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-11-01

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11-01
        with:
          category: integration
